[package]
name = "relgen"
version = "0.3.1"
edition = "2021"
authors = ["Peter Luladjev<relgen@luladjiev.com>"]
description = "CLI tool for generating Pull Requests to multiple repositories"
keywords = ["github", "cli", "rust"]
license = "MIT"
repository = "https://github.com/Luladjiev/relgen"

[dependencies]
chrono = "0.4.38"
clap = { version = "4.5.16", features = ["derive"] }
futures = "0.3.30"
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "rustls", "rustls-ring", "retry", "timeout", "follow-redirect", "tracing"] }
serde = { version = "1.0.209", features = ["derive"] }
tokio = { version = "1.39.3", features = ["rt", "rt-multi-thread", "macros"] }
